<!DOCTYPE html>
<html lang="zh-CN">
<head>
    </head>
<body>
    <div id="loading-overlay" style="display: none;">加载中...</div> 

    <script>
        // ... (省略现有的全局变量，如 globalCloudData, saveCloudData, loadCloudData 等) ...

        // --- 业务逻辑：渲染汇总 ---

        function renderSummary() {
            // ... (保持原有渲染逻辑) ...
        }

        // --- 业务逻辑：删除单条收入 (云端同步) ---
        async function deleteIncome(indexToDelete) {
            if (confirm("确定删除这条收入记录吗？")) {
                // 立即在本地执行删除操作
                const deletedOrder = globalCloudData.income_data.closedOrders.splice(indexToDelete, 1)[0];
                globalCloudData.income_data.total = parseFloat(globalCloudData.income_data.total) - parseFloat(deletedOrder.total);
                
                // 先更新 UI，实现即时反馈
                renderSummary();
                
                // 🌟 核心改动 1: 在后台静默同步数据（无需等待结果）
                console.log('⏳ 后台同步删除操作...');
                const saved = await saveCloudData();
                
                // 🌟 根据同步结果给予反馈，如果失败，则回滚本地数据
                if (saved) {
                    alert("✅ 单条收入记录已删除并已同步到云端。");
                } else {
                    // 回滚本地数据
                    globalCloudData.income_data.closedOrders.splice(indexToDelete, 0, deletedOrder);
                    globalCloudData.income_data.total = parseFloat(globalCloudData.income_data.total) + parseFloat(deletedOrder.total);
                    renderSummary(); // 刷新 UI 回滚
                    alert("🚫 删除失败，请检查网络连接。记录已还原。");
                }
            }
        }
        
        // --- 业务逻辑：清空所有收入 (云端同步) ---
        async function clearAllIncome() {
            if (confirm("警告！您确定要清空所有的收入记录吗？此操作不可撤销，会清除所有历史记录。")) {
                
                // 立即在本地执行清空操作
                const oldIncomeData = globalCloudData.income_data; // 备份旧数据用于回滚
                globalCloudData.income_data = { total: 0, closedOrders: [] }; 
                
                // 先更新 UI，实现即时反馈
                renderSummary();
                
                // 🌟 核心改动 2: 在后台静默同步数据（无需等待结果）
                console.log('⏳ 后台同步清空操作...');
                const saved = await saveCloudData();
                
                // 🌟 根据同步结果给予反馈，如果失败，则回滚本地数据
                if (saved) {
                    alert("✅ 所有收入记录（包括历史数据）已清空并已同步到云端。");
                } else {
                    // 回滚本地数据
                    globalCloudData.income_data = oldIncomeData;
                    renderSummary(); // 刷新 UI 回滚
                    alert("🚫 清空失败，请检查网络连接。记录已还原。");
                }
            }
        }
        
        // 🌟 核心改动 3: 优化初始化逻辑，实现非阻塞加载
        async function loadAndRender() {
            // 1. 立即渲染（使用内存/默认数据）
            renderSummary();
            
            // 2. 后台静默加载数据 (非阻塞)
            console.log('⏳ 开始后台加载云端数据...');
            await loadCloudData(); // 等待数据加载完成，但不会阻塞页面显示
            console.log('✅ 云端数据加载完成，刷新页面数据...');

            // 3. 数据加载完成后，再次渲染，确保使用最新数据
            renderSummary();
        }

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('clearAllBtn').onclick = clearAllIncome;
            
            // 🌟 调用非阻塞加载函数，并移除 loading-overlay 隐藏逻辑
            await loadAndRender(); 
        });
    </script>
</body>
</html>
