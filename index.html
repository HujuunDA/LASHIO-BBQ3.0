<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <style>
        /* --- 烧烤橙色主题 CSS 修改 --- */
        /* ... 省略现有 CSS ... */

        /* 🌟 删除或隐藏 #loading-overlay 样式，以实现即时加载。 */
        /* 由于用户要求，我们不再需要初始的加载遮罩 */
        /* 保持原样但注释掉初始化时的 display='none' 逻辑，让其默认隐藏（如果存在的话） */
    </style>
    </head>
<body>
    <div id="loading-overlay" style="display: none;">加载中...</div> 
    
    <script>
        // ... (省略现有的全局变量和 UTILITY 函数，如 generateId, showModal, hideModal) ...

        // 🌟 新增：全局防抖计时器
        let saveTimeout = null;
        
        // 🌟 核心改动 1: 引入 500ms 防抖保存函数
        async function debouncedSaveCloudData() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                console.log('🚀 500ms 间隔结束，开始后台同步数据...');
                const saved = await saveCloudData();
                if (!saved) {
                    console.error('🚫 后台同步失败，请检查网络！');
                }
            }, 500); // 0.5秒防抖
        }
        
        // 🌟 核心改动 2: 所有的本地数据修改后，调用防抖保存
        function updateOrderTotal() {
            // ... (保持原有逻辑) ...
            debouncedSaveCloudData(); // 替换所有直接调用 saveCloudData 的地方
        }
        
        async function addOrUpdateOrderItem(dishId, quantityChange = 1) {
            // ... (保持原有逻辑) ...
            // 确保计算完 total 后再调用保存
            updateOrderTotal(); // 现在这个函数会触发 debouncedSaveCloudData
            renderOrderDetails();
        }
        
        async function resetOrder() {
            // ... (保持原有逻辑) ...
            renderOrderDetails();
            debouncedSaveCloudData(); // 替换原有的 saveCloudData
        }

        // --- 业务逻辑：菜单/桌台管理 (使用 globalCloudData.tables 和 globalCloudData.menuItems) ---

        // ... (省略 renderMenu, renderTableGrid, renderOrderDetails, selectNewTable 等函数) ...
        
        async function checkoutAndSaveIncome() {
            // ... (保持原有逻辑，但注意这里需要即时保存，不能防抖) ...
            // 结账是即时操作，需要等待保存结果
            const saved = await saveCloudData();
            if (saved) {
                // ... (原有成功逻辑) ...
            } else {
                // ... (原有失败逻辑) ...
            }
        }

        // 🌟 核心改动 3: 优化初始化逻辑，实现非阻塞加载
        async function loadAndRender() {
            // 1. 立即渲染菜单和桌号网格 (使用内存中的旧数据或默认数据)
            renderMenu();
            renderTableGrid();
            
            // 2. 默认选择桌号 1 (即使数据未加载完也允许操作)
            selectNewTable('1');

            // 3. 后台静默加载数据 (非阻塞)
            console.log('⏳ 开始后台加载云端数据...');
            await loadCloudData(); // 等待数据加载完成，但不会阻塞页面显示
            console.log('✅ 云端数据加载完成，刷新页面数据...');

            // 4. 数据加载完成后，再次渲染，确保使用最新数据
            renderMenu();
            renderTableGrid();
            renderOrderDetails();
        }

        // 页面启动 (这里是关键！确保只有初始化操作)
        document.addEventListener('DOMContentLoaded', async () => {
            // 🌟 移除： document.getElementById('loading-overlay').style.display = 'none';
            await loadAndRender(); // 调用新的非阻塞加载函数
            bindEventListeners();
            bindMenuInteractions(); // 绑定菜单行点击交互（只绑定一次）
        });
    </script>
</body>
</html>
