<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>采购管理</title>
    <style>
        /* --- 全局样式保持不变 --- */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f2f2f7; padding-bottom: 80px; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
        .header-bar { background: #007aff; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .header-bar h1 { margin: 0; font-size: 18px; font-weight: 600; }
        .back-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
        .tabs { display: flex; background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 50px; z-index: 9; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #f0f0f0; border-radius: 8px; margin: 0 5px; font-weight: 600; color: #888; cursor: pointer; }
        .tab-btn.active { background: #007aff; color: white; }
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }

        /* 列表样式 */
        .category-group { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 15px; }
        .category-header { background: #f9f9f9; padding: 10px 15px; font-size: 14px; color: #007aff; font-weight: bold; border-bottom: 1px solid #eee; }
        .cart-category-header { background: #fdfdfd; padding: 8px 15px; font-size: 13px; color: #999; font-weight: 600; border-bottom: 1px solid #f0f0f0; }
        .item-row { padding: 12px 15px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
        input[type="checkbox"] { width: 22px; height: 22px; margin-right: 12px; accent-color: #007aff; }
        .item-label { flex-grow: 1; font-size: 16px; }
        .quantity-picker { display: flex; align-items: center; gap: 5px; }
        .quantity-input { width: 35px; border: none; text-align: center; font-size: 16px; background: transparent; }
        .qty-btn { background: #eee; border: none; border-radius: 4px; width: 24px; height: 24px; font-size: 16px; }
        
        /* 采购单样式优化 */
        .cart-container { background: transparent; }
        .cart-row { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid #eee; background: white; }
        .cart-row.done { background-color: #f0fdf4; }
        .item-info { flex: 1; }
        .price-input { width: 90px; padding: 8px; border: 1px solid #ddd; border-radius: 8px; text-align: right; font-size: 16px; background: #fafafa; }
        
        #saveIndicator { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
        #saveIndicator.show { opacity: 1; }
        .primary-btn { background: #007aff; color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; font-size: 16px; margin-top: 15px; }
        .clear-btn { background: #ff3b30; color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 20px; }
        .total-bar { background: #1c1c1e; color: white; padding: 15px 20px; position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .copy-btn { background: #34c759; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 85%; }
        .modal-input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="saveIndicator">同步中...</div>
    
    <div class="header-bar">
        <h1>🛒 采购助手</h1>
        <button class="back-btn" onclick="window.location.href='index.html'">返回</button>
    </div>

    <div class="tabs">
        <button id="btn-pick" class="tab-btn" onclick="switchTab('pick')">📦 选品库</button>
        <button id="btn-cart" class="tab-btn" onclick="switchTab('cart')">📋 采购单 (<span id="cartCount">0</span>)</button>
    </div>

    <div id="pickTab" class="tab-content">
        <div id="productList"></div>
        <button class="primary-btn" onclick="document.getElementById('addItemModal').style.display='flex'">+ 添加新商品</button>
    </div>

    <div id="cartTab" class="tab-content">
        <div class="cart-container" id="cartList"></div>
        <button class="clear-btn" onclick="clearDone()">🧹 清除已买好</button>
        <div style="height: 100px;"></div>
    </div>

    <div class="total-bar" id="totalBar" style="display:none;">
        <div>
            <div style="font-size: 12px; color: #888;">已买总额</div>
            <div style="font-size: 18px; font-weight: bold;" id="grandTotal">0 Ks</div>
        </div>
        <button class="copy-btn" onclick="copyText()">📋 复制清单</button>
    </div>

    <script>
        const TAB_KEY = 'bbq_active_tab';
        const lastTab = localStorage.getItem(TAB_KEY) || 'pick';
        
        document.getElementById('btn-' + lastTab).classList.add('active');
        document.getElementById(lastTab + 'Tab').classList.add('active');
        if(lastTab === 'cart') document.getElementById('totalBar').style.display = 'flex';

        const JSONBIN_ID = '69174442ae596e708f5901ae'; 
        const JSONBIN_MASTER_KEY = '$2a$10$ol9N5tLV0G2AnDYaF4sO4O2l0RoR8OSXagA4IUy2wiwdntZDuzRh2';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
        const CACHE_KEY = 'bbq_app_local_cache';

        let globalData = { purchase_data: { productTemplate: {}, cartData: [] } };

        const debounceSave = (function() {
            let timer;
            return function() {
                localStorage.setItem(CACHE_KEY, JSON.stringify(globalData));
                const indicator = document.getElementById('saveIndicator');
                indicator.textContent = "本地已存...";
                indicator.classList.add('show');
                clearTimeout(timer);
                timer = setTimeout(async () => {
                    indicator.textContent = "云端同步中...";
                    try {
                        await fetch(JSONBIN_URL, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
                            body: JSON.stringify(globalData)
                        });
                        indicator.textContent = "✅ 已同步";
                        setTimeout(() => indicator.classList.remove('show'), 1000);
                    } catch (e) { indicator.textContent = "❌ 同步失败"; }
                }, 1500); 
            };
        })();

        async function init() {
            const local = localStorage.getItem(CACHE_KEY);
            if (local) { globalData = JSON.parse(local); renderAll(); }
            try {
                const res = await fetch(JSONBIN_URL + '/latest', { headers: { 'X-Master-Key': JSONBIN_MASTER_KEY } });
                if (res.ok) {
                    const json = await res.json();
                    globalData = json.record;
                    renderAll();
                }
            } catch(e) {}
        }

        function switchTab(tab) {
            localStorage.setItem(TAB_KEY, tab);
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            document.getElementById('btn-' + tab).classList.add('active');
            document.getElementById('totalBar').style.display = (tab === 'cart') ? 'flex' : 'none';
            if(tab === 'cart') renderCart(); else renderPick();
        }

        function renderAll() {
            renderPick();
            renderCart();
            const dl = document.getElementById('catList');
            if(dl) dl.innerHTML = Object.keys(globalData.purchase_data.productTemplate).map(c => `<option value="${c}">`).join('');
        }

        function renderPick() {
            const list = document.getElementById('productList');
            if(!list) return;
            list.innerHTML = '';
            const tmpl = globalData.purchase_data.productTemplate;
            const cartNames = new Set(globalData.purchase_data.cartData.map(i => i.name));
            Object.keys(tmpl).sort().forEach(cat => {
                const group = document.createElement('div');
                group.className = 'category-group';
                group.innerHTML = `<div class="category-header">${cat}</div>`;
                tmpl[cat].forEach((item, idx) => {
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerHTML = `
                        <input type="checkbox" ${cartNames.has(item.name)?'checked':''} onchange="toggleCart('${item.name}', this.checked, ${item.qty})">
                        <span class="item-label">${item.name}</span>
                        <div class="quantity-picker">
                            <button class="qty-btn" onclick="changeTmplQty('${cat}', ${idx}, -1)">-</button>
                            <input class="quantity-input" value="${item.qty}" readonly>
                            <button class="qty-btn" onclick="changeTmplQty('${cat}', ${idx}, 1)">+</button>
                        </div>
                    `;
                    group.appendChild(row);
                });
                list.appendChild(group);
            });
        }

        // 修改点：在采购单中实现自动按分类排序显示
        function renderCart() {
            const container = document.getElementById('cartList');
            if(!container) return;
            container.innerHTML = '';
            
            const cart = globalData.purchase_data.cartData;
            document.getElementById('cartCount').textContent = cart.length;
            
            const tmpl = globalData.purchase_data.productTemplate;
            const nameToCat = {};
            // 建立名称到分类的反向映射
            for(let c in tmpl) tmpl[c].forEach(i => nameToCat[i.name] = c);

            // 按照分类对购物车数据进行分组
            const groups = {};
            cart.forEach((item, i) => {
                const c = nameToCat[item.name] || '未分类';
                if(!groups[c]) groups[c] = [];
                groups[c].push({...item, originalIdx: i});
            });

            // 按分类排序并渲染
            Object.keys(groups).sort().forEach(c => {
                const groupCard = document.createElement('div');
                groupCard.className = 'category-group'; // 使用和选品库一样的卡片风格
                
                const head = document.createElement('div');
                head.className = 'cart-category-header';
                head.textContent = c;
                groupCard.appendChild(head);

                groups[c].forEach(item => {
                    const row = document.createElement('div');
                    row.className = `cart-row ${item.purchased?'done':''}`;
                    row.innerHTML = `
                        <input type="checkbox" ${item.purchased?'checked':''} onchange="setPurchased(${item.originalIdx}, this.checked)">
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-qty">x${item.qty}</div>
                        </div>
                        <input type="number" class="price-input" placeholder="Ks" value="${item.price||''}" oninput="updatePrice(${item.originalIdx}, this.value)">
                    `;
                    groupCard.appendChild(row);
                });
                container.appendChild(groupCard);
            });
            updateTotal();
        }

        window.toggleCart = (name, checked, qty) => {
            if(checked) {
                if(!globalData.purchase_data.cartData.find(i => i.name === name)) {
                    globalData.purchase_data.cartData.push({name, qty, price:'', purchased:false});
                }
            } else {
                globalData.purchase_data.cartData = globalData.purchase_data.cartData.filter(i => i.name !== name);
            }
            renderCart();
            debounceSave();
        };

        window.changeTmplQty = (cat, idx, delta) => {
            const item = globalData.purchase_data.productTemplate[cat][idx];
            item.qty = Math.max(1, item.qty + delta);
            const inCart = globalData.purchase_data.cartData.find(i => i.name === item.name);
            if(inCart) inCart.qty = item.qty;
            renderAll();
            debounceSave();
        };

        window.updatePrice = (idx, val) => {
            const item = globalData.purchase_data.cartData[idx];
            item.price = val;
            item.purchased = !!val; 
            updateTotal();
            debounceSave();
        };

        window.setPurchased = (idx, checked) => {
            globalData.purchase_data.cartData[idx].purchased = checked;
            renderCart();
            debounceSave();
        };

        window.saveNewItem = () => {
            const name = document.getElementById('modalName').value.trim();
            const cat = document.getElementById('modalCat').value.trim() || '默认';
            if(!name) return;
            if(!globalData.purchase_data.productTemplate[cat]) globalData.purchase_data.productTemplate[cat] = [];
            
            const exists = globalData.purchase_data.productTemplate[cat].find(i => i.name === name);
            if(!exists) {
                globalData.purchase_data.productTemplate[cat].push({name, qty: 1});
            }
            
            toggleCart(name, true, 1);
            document.getElementById('addItemModal').style.display='none';
            document.getElementById('modalName').value = '';
            renderAll();
        };

        window.clearDone = () => {
            globalData.purchase_data.cartData = globalData.purchase_data.cartData.filter(i => !i.purchased);
            renderAll();
            debounceSave();
        };

        function updateTotal() {
            let total = 0;
            globalData.purchase_data.cartData.forEach(i => {
                if(i.purchased && i.price) total += parseFloat(i.price);
            });
            document.getElementById('grandTotal').textContent = total.toLocaleString() + " Ks";
        }

        window.copyText = () => {
            let text = "📋 采购清单:\n";
            // 复制也按分类组织
            const tmpl = globalData.purchase_data.productTemplate;
            const nameToCat = {};
            for(let c in tmpl) tmpl[c].forEach(i => nameToCat[i.name] = c);
            
            const groups = {};
            globalData.purchase_data.cartData.forEach(item => {
                const c = nameToCat[item.name] || '其他';
                if(!groups[c]) groups[c] = [];
                groups[c].push(item);
            });

            Object.keys(groups).sort().forEach(c => {
                text += `\n[${c}]\n`;
                groups[c].forEach(i => {
                    text += `${i.purchased?'[√]':'[ ]'} ${i.name} x${i.qty} ${i.price?i.price+'Ks':''}\n`;
                });
            });

            navigator.clipboard.writeText(text).then(() => alert("已复制（按分类排序）"));
        };

        init();
    </script>

    <div id="addItemModal" class="modal-overlay">
        <div class="modal-content">
            <h3>添加商品</h3>
            <input type="text" id="modalName" class="modal-input" placeholder="名称 (如: 猪肉)">
            <input type="text" list="catList" id="modalCat" class="modal-input" placeholder="分类 (如: 肉类)">
            <datalist id="catList"></datalist>
            <div style="display:flex; gap:10px;">
                <button class="primary-btn" style="background:#ccc;" onclick="document.getElementById('addItemModal').style.display='none'">取消</button>
                <button class="primary-btn" onclick="saveNewItem()">保存</button>
            </div>
        </div>
    </div>
</body>
</html>
