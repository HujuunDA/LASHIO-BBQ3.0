<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>采购管理</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #f2f2f7; padding-bottom: 60px; touch-action: manipulation; }
        
        /* 头部导航 (保持一致性) */
        .header-bar { 
            background: #007aff; color: white; padding: 12px 15px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 10;
        }
        .header-bar h1 { margin: 0; font-size: 18px; }
        .back-btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 14px; font-weight: 600; }

        /* Tabs */
        .tabs { display: flex; background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #f0f0f0; border-radius: 8px; margin: 0 5px; font-weight: 600; color: #888; transition: 0.2s; }
        .tab-btn.active { background: #007aff; color: white; }

        /* 内容区 */
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }

        /* 选品列表 */
        .category-group h3 { font-size: 14px; color: #007aff; margin: 15px 0 5px; text-transform: uppercase; letter-spacing: 1px; }
        .item-row { 
            background: white; padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; 
            justify-content: space-between;
        }
        .item-row:first-child { border-top-left-radius: 10px; border-top-right-radius: 10px; }
        .item-row:last-child { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; border-bottom: none; }
        
        input[type="checkbox"] { width: 24px; height: 24px; margin-right: 10px; }
        .item-label { flex-grow: 1; font-size: 16px; }
        
        .action-btn { border: none; background: none; font-size: 16px; padding: 5px 10px; color: #999; }
        .delete-item { color: #ff3b30; }

        /* 购物车表格 */
        .cart-table { width: 100%; background: white; border-radius: 10px; border-collapse: collapse; overflow: hidden; }
        .cart-table td { padding: 12px; border-bottom: 1px solid #eee; }
        .price-input { width: 80px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; text-align: right; font-size: 16px; }
        .done-row { opacity: 0.5; text-decoration: line-through; background: #f9f9f9; }

        /* 底部控件 */
        .add-bar { background: white; padding: 15px; margin-top: 20px; border-radius: 10px; display: flex; gap: 10px; }
        .add-bar input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .primary-btn { background: #007aff; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; }
        
        .total-bar { background: #333; color: white; padding: 15px; position: fixed; bottom: 0; width: 100%; left: 0; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; }
        .copy-btn { background: #34c759; color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        #saveIndicator { position: fixed; top: 60px; right: 15px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; z-index: 99; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #saveIndicator.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="saveIndicator">☁️ 已同步</div>
    
    <div class="header-bar">
        <h1>🛒 采购助手</h1>
        <button class="back-btn" onclick="window.location.href='index.html'">返回系统</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pick')">📦 选品</button>
        <button class="tab-btn" onclick="switchTab('cart')">📋 清单 (<span id="cartCount">0</span>)</button>
    </div>

    <div id="pickTab" class="tab-content active">
        <div id="productList"></div>
        
        <div class="add-bar">
            <input type="text" id="newItemName" placeholder="输入新商品名称...">
            <button class="primary-btn" onclick="addNewItem()">添加</button>
        </div>
        <div style="height: 60px;"></div>
    </div>

    <div id="cartTab" class="tab-content">
        <table class="cart-table">
            <tbody id="cartBody"></tbody>
        </table>
        
        <div style="margin-top: 20px; text-align: center;">
            <button class="primary-btn" style="background: #ff3b30;" onclick="clearDone()">🧹 清除已买好的</button>
        </div>
        <div style="height: 80px;"></div> </div>

    <div class="total-bar" id="totalBar" style="display:none;">
        <div style="font-size: 18px; font-weight: bold;">总计: <span id="grandTotal">0</span></div>
        <button class="copy-btn" onclick="copyText()">📋 复制清单</button>
    </div>

    <script>
        // 统一配置
        const JSONBIN_ID = '69174442ae596e708f5901ae'; 
        const JSONBIN_MASTER_KEY = '$2a$10$ol9N5tLV0G2AnDYaF4sO4O2l0RoR8OSXagA4IUy2wiwdntZDuzRh2';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
        const CACHE_KEY = 'bbq_app_local_cache'; 

        let globalData = { purchase_data: { productTemplate: {}, cartData: [] } };

        function loadCache() { const c = localStorage.getItem(CACHE_KEY); return c ? JSON.parse(c) : null; }
        function saveCache(data) { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }
        function debounce(fn, wait) { let t; return function(...args) { clearTimeout(t); t = setTimeout(()=>fn.apply(this, args), wait); }; }

        async function init() {
            const local = loadCache();
            if (local) { globalData = local; renderAll(); }
            
            try {
                const res = await fetch(JSONBIN_URL + '/latest', { headers: { 'X-Master-Key': JSONBIN_MASTER_KEY } });
                const json = await res.json();
                if (json.record) {
                    globalData = json.record;
                    if(!globalData.purchase_data) globalData.purchase_data = { productTemplate: {"默认":[]}, cartData: [] };
                    saveCache(globalData);
                    renderAll();
                }
            } catch(e) {}
        }

        const saveData = debounce(async () => {
            const ind = document.getElementById('saveIndicator');
            ind.classList.add('show'); ind.textContent = '同步中...';
            
            saveCache(globalData);
            try {
                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
                    body: JSON.stringify(globalData)
                });
                ind.textContent = '✅ 已同步';
                setTimeout(()=>ind.classList.remove('show'), 2000);
            } catch(e) { ind.textContent = '仅本地保存'; }
        }, 1000);

        // --- 逻辑 ---
        function renderAll() {
            renderProductList();
            renderCart();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab+'Tab').classList.add('active');
            event.currentTarget.classList.add('active');
            if(tab === 'cart') document.getElementById('totalBar').style.display = 'flex';
            else document.getElementById('totalBar').style.display = 'none';
        }

        // 1. 选品列表
        function renderProductList() {
            const container = document.getElementById('productList');
            container.innerHTML = '';
            const tmpl = globalData.purchase_data.productTemplate || {};
            const cartNames = new Set((globalData.purchase_data.cartData || []).map(i => i.name));

            for (const [cat, items] of Object.entries(tmpl)) {
                const div = document.createElement('div');
                div.className = 'category-group';
                div.innerHTML = `<h3>${cat}</h3>`;
                
                items.forEach(item => {
                    const checked = cartNames.has(item) ? 'checked' : '';
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerHTML = `
                        <div style="display:flex; align-items:center; flex:1;">
                            <input type="checkbox" onchange="toggleCart('${item}')" ${checked}>
                            <span class="item-label">${item}</span>
                        </div>
                        <button class="action-btn delete-item" onclick="deleteTemplate('${cat}', '${item}')">🗑</button>
                    `;
                    div.appendChild(row);
                });
                container.appendChild(div);
            }
        }

        window.toggleCart = (name) => {
            let cart = globalData.purchase_data.cartData || [];
            const idx = cart.findIndex(i => i.name === name);
            
            if(idx > -1) {
                cart.splice(idx, 1);
            } else {
                cart.push({ name: name, purchased: false, price: '' });
            }
            globalData.purchase_data.cartData = cart;
            renderCart();
            saveData();
        };

        window.addNewItem = () => {
            const val = document.getElementById('newItemName').value.trim();
            if(!val) return;
            
            // 简单归类逻辑
            const tmpl = globalData.purchase_data.productTemplate;
            let targetCat = '默认';
            if(!tmpl[targetCat]) tmpl[targetCat] = [];
            
            if(!Object.values(tmpl).flat().includes(val)) {
                tmpl[targetCat].push(val);
                toggleCart(val); // 自动加入购物车
                document.getElementById('newItemName').value = '';
                renderProductList();
                saveData();
            }
        };
        
        window.deleteTemplate = (cat, item) => {
            if(confirm('从模板中彻底删除？')) {
                const list = globalData.purchase_data.productTemplate[cat];
                const idx = list.indexOf(item);
                if(idx > -1) list.splice(idx, 1);
                renderProductList();
                saveData();
            }
        }

        // 2. 购物车
        function renderCart() {
            const body = document.getElementById('cartBody');
            body.innerHTML = '';
            const cart = globalData.purchase_data.cartData || [];
            document.getElementById('cartCount').textContent = cart.length;
            
            let total = 0;

            if(cart.length === 0) {
                body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#999;">清单是空的</td></tr>';
            } else {
                cart.forEach((item, idx) => {
                    const doneClass = item.purchased ? 'done-row' : '';
                    const row = document.createElement('tr');
                    row.className = doneClass;
                    row.innerHTML = `
                        <td width="30"><input type="checkbox" ${item.purchased ? 'checked' : ''} onchange="toggleStatus(${idx})"></td>
                        <td>${item.name}</td>
                        <td width="90">
                            <input type="number" class="price-input" placeholder="0" value="${item.price}" oninput="updatePrice(${idx}, this.value)">
                        </td>
                    `;
                    body.appendChild(row);
                    if(item.purchased && item.price) total += Number(item.price);
                });
            }
            document.getElementById('grandTotal').textContent = total.toLocaleString();
        }

        window.toggleStatus = (idx) => {
            const item = globalData.purchase_data.cartData[idx];
            item.purchased = !item.purchased;
            renderCart();
            saveData();
        };

        window.updatePrice = (idx, val) => {
            const item = globalData.purchase_data.cartData[idx];
            item.price = val;
            if(val > 0) item.purchased = true; // 输入价格自动勾选
            renderCart(); // 注意：这会导致输入框失去焦点，实际上应该用防抖，这里为了简化直接重绘，体验可能稍差。
            // 优化：不完全重绘，只更新总价，这里略过保持简单。
            saveData();
        };

        window.clearDone = () => {
            if(confirm('清除所有已买好的？')) {
                globalData.purchase_data.cartData = globalData.purchase_data.cartData.filter(i => !i.purchased);
                renderCart();
                renderProductList(); // 刷新选品页的勾选状态
                saveData();
            }
        };

        window.copyText = () => {
            const cart = globalData.purchase_data.cartData;
            let text = `📅 ${new Date().toLocaleDateString()} 采购单:\n`;
            let total = 0;
            cart.forEach(i => {
                if(i.purchased) {
                    text += `✅ ${i.name}: ${i.price}\n`;
                    total += Number(i.price || 0);
                } else {
                    text += `⬜ ${i.name}\n`;
                }
            });
            text += `\n💰 总计: ${total}`;
            navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板'));
        };

        init();
    </script>
</body>
</html>
