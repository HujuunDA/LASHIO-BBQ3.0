<!DOCTYPE html>
<html lang="zh-CN">
<head>
    </head>
<body>
    <div id="loading-overlay" style="display: none;">加载中...</div> 
    
    <script>
        // ... (省略现有的全局变量，如 cloudData, saveProductsToCloud, loadProductsFromCloud 等) ...
        
        // 🌟 新增：全局防抖计时器
        let saveTimeout = null;

        // 🌟 核心改动 1: 引入 500ms 防抖保存函数
        async function debouncedSaveProductsToCloud() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                console.log('🚀 500ms 间隔结束，开始后台同步采购数据...');
                const saved = await saveProductsToCloud();
                if (!saved) {
                    console.error('🚫 后台同步失败，请检查网络！');
                }
            }, 500); // 0.5秒防抖
        }

        // --- 业务逻辑：渲染采购列表 ---
        function renderCart() {
            // ... (保持原有渲染逻辑) ...
            // 🌟 核心改动 2: 在 renderCart 中也触发防抖保存，捕获价格或数量的输入
            debouncedSaveProductsToCloud(); 
        }

        // --- 业务逻辑：添加/编辑项目 ---
        async function addOrUpdateCartItem() {
            // ... (保持原有逻辑) ...
            
            // 🌟 核心改动 3: 使用防抖保存
            renderCart();
            debouncedSaveProductsToCloud(); // 替换原有 await saveProductsToCloud()
        }

        // --- 业务逻辑：删除项目 ---
        async function deleteItem(id) {
            // ... (保持原有逻辑) ...
            
            // 🌟 核心改动 4: 使用防抖保存
            renderCart();
            debouncedSaveProductsToCloud(); // 替换原有 await saveProductsToCloud()
        }
        
        // --- 业务逻辑：重置/清空已购买项目 ---
        async function resetCart() {
            // ... (保持原有逻辑) ...
            
            if (confirm(`确定要清空 ${purchasedItems.length} 个已完成的项目吗？`)) {
                // 🌟 确保在同步保存前取消所有挂起的防抖保存
                clearTimeout(debouncedSaveProductsToCloud.timeout); 
                
                // ... (原有逻辑：删除已购买项目) ...
                
                // 🌟 核心改动 5: 这里需要即时保存（非防抖），因为是最终的清空操作
                await saveProductsToCloud(); // 保持 await saveProductsToCloud()
                
                // ... (原有成功/失败反馈逻辑) ...
            }
        }
        
        // ... (省略 generateSummaryText, copySummaryToClipboard 函数) ...

        // 🌟 核心改动 6: 优化初始化逻辑，实现非阻塞加载
        async function loadAndRender() {
            // 1. 立即渲染（使用内存/默认数据）
            renderCart();
            
            // 2. 后台静默加载数据 (非阻塞)
            console.log('⏳ 开始后台加载云端数据...');
            await loadProductsFromCloud(); // 等待数据加载完成，但不会阻塞页面显示
            console.log('✅ 云端数据加载完成，刷新页面数据...');

            // 3. 数据加载完成后，再次渲染，确保使用最新数据
            renderCart();
        }

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', async () => {
            // ... (原有事件绑定) ...
            
            // 🌟 调用非阻塞加载函数，并移除 loading-overlay 隐藏逻辑
            await loadAndRender(); 
        });
    </script>
</body>
</html>
