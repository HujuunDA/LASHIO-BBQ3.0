<!DOCTYPE html>
<html lang="zh-CN">
<head>
    </head>
<body>
    <div id="loading-overlay" style="display: none;">加载中...</div> 

    <script>
        // ... (省略现有的全局变量，如 globalCloudData, menuItems, itemModal 等) ...

        // 🌟 新增：全局防抖计时器
        let saveTimeout = null;
        
        // 🌟 核心改动 1: 引入 500ms 防抖保存函数
        async function debouncedSaveCloudData() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                console.log('🚀 500ms 间隔结束，开始后台同步菜单数据...');
                const saved = await saveCloudData();
                if (!saved) {
                    console.error('🚫 后台同步失败，请检查网络！');
                }
            }, 500); // 0.5秒防抖
        }

        // --- 业务逻辑：菜单管理 ---

        async function addItem(event) {
            // ... (原有表单处理和数据更新逻辑) ...

            if (itemId) {
                // ... (编辑逻辑) ...
            } else {
                // ... (添加逻辑) ...
            }
            
            // 🌟 核心改动 2: 使用防抖保存
            renderMenu();
            hideModal();
            debouncedSaveCloudData(); // 替换 await saveCloudData()

            return false;
        }

        async function deleteItem(id) {
            if (confirm('确定要删除此菜品吗？此操作不可撤销。')) {
                menuItems = menuItems.filter(item => item.id !== id);
                
                // 🌟 核心改动 3: 使用防抖保存
                renderMenu();
                debouncedSaveCloudData(); // 替换原有 await saveCloudData()
            }
        }
        
        // ... (省略 showModal, hideModal, goToOrderingPage 函数) ...

        // 🌟 核心改动 4: 优化初始化逻辑，实现非阻塞加载
        async function loadAndRender() {
            // 1. 立即渲染（使用内存/默认数据）
            renderMenu();
            
            // 2. 后台静默加载数据 (非阻塞)
            console.log('⏳ 开始后台加载云端数据...');
            await loadCloudData(); // 等待数据加载完成，但不会阻塞页面显示
            console.log('✅ 云端数据加载完成，刷新页面数据...');

            // 3. 数据加载完成后，再次渲染，确保使用最新数据
            renderMenu();
        }

        // --- 初始化 ---
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('openModalBtn').onclick = () => {
                showModal('添加新菜品');
                renderCategoryOptions(); 
            };
            document.getElementById('itemForm').onsubmit = addItem;
            
            // 🌟 调用非阻塞加载函数，并移除 loading-overlay 隐藏逻辑
            await loadAndRender();
        });
    </script>
</body>
</html>
