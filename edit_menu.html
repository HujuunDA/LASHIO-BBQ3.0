<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>编辑菜单</title>
    <style>
        /* 全局流畅度优化 */
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding-top: 60px; background-color: #f4f4f4; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
        button:active { transform: scale(0.96); transition: transform 0.1s; }

        /* 顶部栏 */
        .header-bar { 
            background-color: #FF8C00; color: white; padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: fixed; top: 0; width: 100%; z-index: 10; box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header-bar h2 { margin: 0; font-size: 18px; font-weight: 700; }
        .header-bar button { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: 600; }

        /* 列表区域 */
        .menu-list { padding: 15px; padding-bottom: 80px; opacity: 0; transition: opacity 0.3s; }
        .menu-list.loaded { opacity: 1; }
        
        .category-block { margin-bottom: 20px; }
        .category-title { font-size: 16px; color: #FF8C00; font-weight: 800; margin-bottom: 10px; padding-left: 5px; border-left: 4px solid #FF8C00; }

        .menu-item-card { 
            background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .item-info .name { font-size: 16px; font-weight: 600; color: #333; }
        .item-info .price { font-size: 14px; color: #888; margin-top: 4px; }
        
        .actions button { margin-left: 8px; padding: 6px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .edit-btn { background-color: #fff3e0; color: #FF8C00; }
        .delete-btn { background-color: #ffebee; color: #d32f2f; }

        /* 底部浮动按钮 */
        .fab-add {
            position: fixed; bottom: 30px; right: 20px;
            background: #FF4500; color: white;
            width: 56px; height: 56px; border-radius: 50%;
            border: none; box-shadow: 0 4px 12px rgba(255, 69, 0, 0.4);
            font-size: 30px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 99;
        }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        .modal.show { opacity: 1; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; width: 85%; max-width: 320px; transform: scale(0.9); transition: transform 0.2s; }
        .modal.show .modal-content { transform: scale(1); }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; background: #fafafa; }
        .modal-actions { display: flex; justify-content: space-between; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; }
        .save-btn { background: #FF8C00; color: white; }
        .cancel-btn { background: #f5f5f5; color: #333; }

        #saveIndicator { position: fixed; top: 60px; right: 15px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; z-index: 99; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #saveIndicator.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="saveIndicator">☁️ 已同步</div>

    <header class="header-bar">
        <h2>📝 菜单管理</h2>
        <button onclick="window.location.href='index.html'">返回点单</button>
    </header>

    <div class="menu-list" id="menuList"></div>
    <button class="fab-add" id="openModalBtn">＋</button>

    <div id="itemModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; color:#333;">菜品信息</h3>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <label>名称</label>
                <input type="text" id="itemName" required placeholder="例如：烤羊肉串">
                <label>价格 (Ks)</label>
                <input type="number" id="itemPrice" required placeholder="0">
                <label>分类</label>
                <select id="itemCategory" required></select>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="hideModal()">取消</button>
                    <button type="submit" class="save-btn">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- 共享配置 (必须与 index.html 完全一致) ---
        const JSONBIN_ID = '69174442ae596e708f5901ae'; 
        const JSONBIN_MASTER_KEY = '$2a$10$ol9N5tLV0G2AnDYaF4sO4O2l0RoR8OSXagA4IUy2wiwdntZDuzRh2';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;
        const CACHE_KEY = 'bbq_app_local_cache'; 

        let globalData = { menu_data: [] };

        // --- 本地缓存工具 ---
        function loadCache() {
            const c = localStorage.getItem(CACHE_KEY);
            return c ? JSON.parse(c) : null;
        }
        function saveCache(data) { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }
        function debounce(fn, wait) { let t; return function(...args) { clearTimeout(t); t = setTimeout(()=>fn.apply(this, args), wait); }; }

        // --- 数据加载 ---
        async function init() {
            // 1. 缓存优先
            const local = loadCache();
            if (local) {
                globalData = local;
                renderList();
            }
            
            // 2. 悄悄同步
            try {
                const res = await fetch(JSONBIN_URL + '/latest', { headers: { 'X-Master-Key': JSONBIN_MASTER_KEY } });
                const json = await res.json();
                if (json.record) {
                    globalData = json.record;
                    if(!globalData.menu_data) globalData.menu_data = [];
                    saveCache(globalData); // 更新缓存
                    renderList(); // 刷新界面
                }
            } catch (e) { console.log('离线模式'); }
        }

        // --- 保存逻辑 ---
        async function saveData() {
            const ind = document.getElementById('saveIndicator');
            ind.textContent = '☁️ 同步中...'; ind.classList.add('show');
            
            saveCache(globalData); // 立即存本地
            
            try {
                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
                    body: JSON.stringify(globalData)
                });
                ind.textContent = '✅ 已同步';
                setTimeout(()=>ind.classList.remove('show'), 2000);
            } catch (e) {
                ind.textContent = '⚠️ 仅本地保存';
                setTimeout(()=>ind.classList.remove('show'), 3000);
            }
        }

        // --- 渲染逻辑 ---
        function renderList() {
            const list = document.getElementById('menuList');
            list.innerHTML = '';
            list.classList.add('loaded');
            
            const items = globalData.menu_data || [];
            if (items.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#999; margin-top:50px;">暂无菜品，点击右下角添加</div>';
                return;
            }

            const groups = items.reduce((acc, item) => {
                (acc[item.category] = acc[item.category] || []).push(item);
                return acc;
            }, {});

            for (const [cat, catItems] of Object.entries(groups)) {
                const block = document.createElement('div');
                block.className = 'category-block';
                block.innerHTML = `<div class="category-title">${cat}</div>`;
                
                catItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'menu-item-card';
                    div.innerHTML = `
                        <div class="item-info">
                            <div class="name">${item.name}</div>
                            <div class="price">${Number(item.price).toLocaleString()} Ks</div>
                        </div>
                        <div class="actions">
                            <button class="edit-btn" onclick="editItem('${item.id}')">编辑</button>
                            <button class="delete-btn" onclick="deleteItem('${item.id}')">删除</button>
                        </div>
                    `;
                    block.appendChild(div);
                });
                list.appendChild(block);
            }
            renderCategoryOptions();
        }

        function renderCategoryOptions() {
            const select = document.getElementById('itemCategory');
            const existing = [...new Set((globalData.menu_data || []).map(i => i.category))];
            select.innerHTML = '<option value="">-- 选择或输入新分类 --</option>';
            existing.forEach(c => {
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
            select.innerHTML += `<option value="NEW">➕ 新增分类...</option>`;
            
            select.onchange = function() {
                if(this.value === 'NEW') {
                    const val = prompt("输入新分类名称:");
                    if(val) {
                        const opt = document.createElement('option');
                        opt.value = val; opt.text = val; opt.selected = true;
                        select.insertBefore(opt, select.lastChild);
                    } else {
                        select.value = "";
                    }
                }
            }
        }

        // --- 操作逻辑 ---
        const modal = document.getElementById('itemModal');
        
        document.getElementById('openModalBtn').onclick = () => {
            document.getElementById('itemForm').reset();
            document.getElementById('itemId').value = '';
            modal.style.display = 'flex';
            setTimeout(()=>modal.classList.add('show'), 10);
            renderCategoryOptions();
        };

        window.hideModal = () => {
            modal.classList.remove('show');
            setTimeout(()=>modal.style.display = 'none', 200);
        };

        window.editItem = (id) => {
            const item = globalData.menu_data.find(i => i.id === id);
            if(!item) return;
            document.getElementById('itemId').value = item.id;
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemPrice').value = item.price;
            
            // 处理分类
            const sel = document.getElementById('itemCategory');
            renderCategoryOptions();
            let opt = Array.from(sel.options).find(o => o.value === item.category);
            if(!opt) {
                opt = new Option(item.category, item.category);
                sel.insertBefore(opt, sel.lastChild);
            }
            sel.value = item.category;
            
            modal.style.display = 'flex';
            setTimeout(()=>modal.classList.add('show'), 10);
        };

        window.deleteItem = async (id) => {
            if(confirm('确定删除吗？')) {
                globalData.menu_data = globalData.menu_data.filter(i => i.id !== id);
                renderList();
                await saveData();
            }
        };

        document.getElementById('itemForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value;
            const price = Number(document.getElementById('itemPrice').value);
            const cat = document.getElementById('itemCategory').value;
            
            if(!name || !price || !cat || cat === 'NEW') return;

            if(id) {
                const idx = globalData.menu_data.findIndex(i => i.id === id);
                if(idx > -1) globalData.menu_data[idx] = { id, name, price, category: cat };
            } else {
                globalData.menu_data.push({
                    id: 'item_' + Date.now(),
                    name, price, category: cat
                });
            }
            
            hideModal();
            renderList();
            await saveData();
        };

        init();
    </script>
</body>
</html>
